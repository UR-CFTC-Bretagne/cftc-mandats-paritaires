name: Continuous Delivery - Apps Script TEST
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apps-script-test
  cancel-in-progress: false
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: apps-script-build
          path: dist/
          retention-days: 7
  deploy-test:
    needs: quality
    if: github.ref == 'refs/heads/main' && github.repository == 'UR-CFTC-Bretagne/cftc-mandats-paritaires'
    runs-on: ubuntu-latest
    environment: apps-script-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify explicit TEST deployment authorization
        env:
          ENABLED: ${{ vars.ALLOW_TEST_CODE_DEPLOY }}
        run: |
          if [ "$ENABLED" != "YES" ]; then
            echo "::error::Environment apps-script-test must have ALLOW_TEST_CODE_DEPLOY=YES"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: apps-script-build
          path: dist/
      - name: Verify deployment configuration without exposing secrets
        env:
          APPS_SCRIPT_TEST_ID: ${{ secrets.APPS_SCRIPT_TEST_ID }}
          CONFIRMED_TEST_SCRIPT_ID: ${{ vars.CONFIRMED_TEST_SCRIPT_ID }}
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: node scripts/verify-test-deploy.js
      - name: Configure clasp credentials and target
        env:
          SCRIPT_ID: ${{ secrets.APPS_SCRIPT_TEST_ID }}
          CLASPRC: ${{ secrets.CLASPRC_JSON }}
        run: |
          printf '%s' "$CLASPRC" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          node -e "require('fs').writeFileSync('.clasp.json',JSON.stringify({scriptId:process.env.SCRIPT_ID,rootDir:'dist'}))"
      - name: Push code to TEST Apps Script project
        run: |
          npm install --no-save --ignore-scripts @google/clasp@2.5.0
          npx clasp push --force
      - name: Remove local credentials
        if: always()
        run: rm -f "$HOME/.clasprc.json" .clasp.json
